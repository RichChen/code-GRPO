[project]
name = "arl"
version = "0.1.0"
description = "Agentic RL: train small models to fix code with multi-turn tool calls (GRPO on a single GPU)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=3.27.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
